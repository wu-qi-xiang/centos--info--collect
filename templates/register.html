{% load static %}

<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Linux监控系统</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <link rel="stylesheet" href="{% static 'css/app-modern.css' %}?v=20260622">
    <link rel="stylesheet" href="{% static 'css/geist-classic-pages.css' %}?v=20260801">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page ops-console">
    <div class="auth-shell">
        <section class="auth-panel">
            <div class="auth-brand">
                <div class="auth-brand-icon"><i class="fas fa-server"></i></div>
                <div>
                    <strong>Linux监控系统</strong>
                    <div class="text-muted">Operations Console</div>
                </div>
            </div>
            <h1>创建运维控制台账号</h1>
            <p class="mb-4">注册后可以录入主机资产、配置监控阈值、使用 DevOps 自动化能力。</p>
            <div class="auth-feature">
                <i class="fas fa-layer-group"></i>
                <div><strong>资产集中</strong><br><span>主机、标签、分组和凭据统一维护。</span></div>
            </div>
            <div class="auth-feature">
                <i class="fas fa-bell"></i>
                <div><strong>告警治理</strong><br><span>告警记录、静默、通知渠道和趋势图。</span></div>
            </div>
            <div class="auth-feature">
                <i class="fas fa-code-branch"></i>
                <div><strong>发布部署</strong><br><span>发布、回滚、审批和执行结果可追溯。</span></div>
            </div>
        </section>

        <section class="auth-card">
            <h2 class="mb-2">注册</h2>
            <p class="text-muted mb-4">填写账号信息开始使用。</p>
            {% if error %}
            <div class="alert alert-info py-2">{{ error }}</div>
            {% endif %}
            <form action="/register/" method="post" id="registerForm">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="user">用户名</label>
                    <input class="form-control" id="user" name="user" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">邮箱</label>
                    <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">密码</label>
                    <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="confirm_pwd">确认密码</label>
                    <input class="form-control" id="confirm_pwd" name="confirm_pwd" type="password" autocomplete="new-password" required>
                </div>
                <button class="btn btn-primary auth-submit" type="submit">创建账户</button>
            </form>
            <div class="text-center mt-4 text-muted">
                已有账户？ <a href="{% url 'userprofile:login' %}">返回登录</a>
            </div>
        </section>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event) {
            var password = document.getElementById('password').value;
            var confirmPwd = document.getElementById('confirm_pwd').value;
            if (password !== confirmPwd) {
                event.preventDefault();
                alert('两次输入的密码不一致');
            }
        });
    </script>
</body>
</html>
