{% extends "base.html" %}

{% block title %}资产管理 - Linux监控系统{% endblock %}

{% block content %}
<div class="ops-page-header">
    <div>
        <h1 class="ops-page-title"><i class="fas fa-server me-2 text-primary"></i>资产管理</h1>
        <p class="ops-page-subtitle">查看本地运行环境和授权范围内的服务器资产。</p>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body d-flex align-items-start justify-content-between gap-3">
                <div>
                    <h2 class="h5 mb-2"><i class="fas fa-desktop me-2 text-primary"></i>本地资产</h2>
                    <p class="text-muted mb-0">查看当前运行节点的系统、网络、内存和磁盘信息。</p>
                </div>
                <a class="btn btn-outline-primary" href="{% url 'linux' %}">进入</a>
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card h-100">
            <div class="card-body d-flex align-items-start justify-content-between gap-3">
                <div>
                    <h2 class="h5 mb-2"><i class="fas fa-list me-2 text-success"></i>资产列表</h2>
                    <p class="text-muted mb-0">查看和管理当前账号有权访问的服务器资产。</p>
                </div>
                <a class="btn btn-outline-primary" href="{% url 'linux_detail' %}">进入</a>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
