{% extends "base.html" %}

{% block title %}事件工单 - DevOps平台{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <h1 class="h3 mb-3">事件工单</h1>
    {% include "devops/_nav.html" %}
    {% if can_operate_incidents %}
    <div class="card mb-3"><div class="card-body">
        <form id="incident-create" class="row g-2">
            {% csrf_token %}
            <div class="col-md-5"><label class="form-label">标题</label><input class="form-control" name="title" maxlength="200" required></div>
            <div class="col-md-2"><label class="form-label">级别</label><select class="form-select" name="severity"><option value="medium">中</option><option value="low">低</option><option value="high">高</option><option value="critical">严重</option></select></div>
            <div class="col-md-5"><label class="form-label">描述</label><input class="form-control" name="description" maxlength="10000"></div>
            <div class="col-12"><button class="btn btn-primary" type="submit">创建事件</button><span id="incident-message" class="ms-2 small"></span></div>
        </form>
    </div></div>
    {% endif %}
    <div class="card"><div class="card-body table-responsive">
        <table class="table table-hover align-middle mb-0"><thead><tr><th>标题</th><th>级别</th><th>状态</th><th>关联资源</th><th>创建人</th><th>更新时间</th></tr></thead><tbody id="incident-results"><tr><td colspan="6" class="text-muted">加载中...</td></tr></tbody></table>
    </div></div>
</div>
{% endblock %}

{% block script %}
<script>
(function () {
    var results = document.getElementById('incident-results');
    var message = document.getElementById('incident-message');
    function csrf() {
        var match = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
        return match ? decodeURIComponent(match[1]) : '';
    }
    function display(items) {
        results.innerHTML = '';
        if (!items.length) { results.innerHTML = '<tr><td colspan="6" class="text-muted">暂无事件</td></tr>'; return; }
        items.forEach(function (item) {
            var refs = item.references || {};
            var names = [];
            if (refs.host) { names.push(refs.host.name || refs.host.ip); }
            if (refs.alert) { names.push('告警 #' + refs.alert.id); }
            if (refs.deployment) { names.push('发布 #' + refs.deployment.id); }
            if (refs.command) { names.push('命令 #' + refs.command.id); }
            var row = document.createElement('tr');
            [item.title, item.severity_label, item.status_label, names.join('，') || '-', item.created_by || '-', item.updated_at || '-'].forEach(function (value) {
                var cell = document.createElement('td'); cell.textContent = value; row.appendChild(cell);
            });
            results.appendChild(row);
        });
    }
    function load() {
        fetch('/devops/api/incidents/', {credentials: 'same-origin'}).then(function (response) { return response.json(); }).then(function (data) {
            display(data.results || []);
        }).catch(function () { results.innerHTML = '<tr><td colspan="6" class="text-danger">事件加载失败</td></tr>'; });
    }
    var form = document.getElementById('incident-create');
    if (form) { form.addEventListener('submit', function (event) {
        event.preventDefault();
        var payload = {title: form.elements.title.value, severity: form.elements.severity.value, description: form.elements.description.value};
        fetch('/devops/api/incidents/', {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf()}, body: JSON.stringify(payload)}).then(function (response) { return response.json(); }).then(function (data) {
            if (!data.ok) { message.textContent = data.message || '创建失败'; message.className = 'ms-2 small text-danger'; return; }
            form.reset(); message.textContent = '已创建'; message.className = 'ms-2 small text-success'; load();
        }).catch(function () { message.textContent = '创建失败'; message.className = 'ms-2 small text-danger'; });
    }); }
    load();
}());
</script>
{% endblock %}
