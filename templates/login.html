{% load static %}

<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Linux监控系统</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <link rel="stylesheet" href="{% static 'css/app-modern.css' %}?v=20260622">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-shell">
        <section class="auth-panel">
            <div class="auth-brand">
                <div class="auth-brand-icon"><i class="fas fa-server"></i></div>
                <div>
                    <strong>Linux监控系统</strong>
                    <div class="text-muted">Operations Console</div>
                </div>
            </div>
            <h1>统一管理服务器、监控与自动化任务</h1>
            <p class="mb-4">面向日常运维工作的控制台，聚合主机资产、WebSSH、告警、审批和发布部署。</p>
            <div class="auth-feature">
                <i class="fas fa-terminal"></i>
                <div><strong>远程运维</strong><br><span>集中执行命令、批量任务和文件分发。</span></div>
            </div>
            <div class="auth-feature">
                <i class="fas fa-chart-line"></i>
                <div><strong>监控告警</strong><br><span>查看指标趋势，接入邮件和 Webhook 通知。</span></div>
            </div>
            <div class="auth-feature">
                <i class="fas fa-shield-alt"></i>
                <div><strong>权限审计</strong><br><span>支持审批流、模块权限、主机组范围和审计日志。</span></div>
            </div>
        </section>

        <section class="auth-card">
            <h2 class="mb-2">登录</h2>
            <p class="text-muted mb-4">使用你的平台账号继续。</p>
            {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}
            <form action="/login/" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="user">用户名</label>
                    <input class="form-control" id="user" name="user" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">密码</label>
                    <div class="input-group">
                        <input class="form-control" id="password" name="pwd" type="password" autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="显示或隐藏密码"><i class="fas fa-eye"></i></button>
                    </div>
                </div>
                <button class="btn btn-primary auth-submit" type="submit">登录</button>
            </form>
            <div class="text-center mt-4 text-muted">
                还没有账户？ <a href="{% url 'userprofile:register' %}">注册新账户</a>
            </div>
        </section>
    </div>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            var input = document.getElementById('password');
            var isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';
            this.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });
    </script>
</body>
</html>
