{% extends "base.html" %}

{% block title %}凭据管理 - Linux监控系统{% endblock %}

{% block content %}
<div class="container-fluid px-4">
    <div class="ops-page-header">
        <div>
            <h1 class="ops-page-title"><i class="fas fa-key me-2 text-warning"></i>凭据管理</h1>
            <p class="ops-page-subtitle">集中管理当前用户的系统账号凭据。</p>
        </div>
    </div>

    <section class="ops-panel">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <h2 class="h5 mb-1">凭据列表</h2>
                <p class="text-muted mb-0">查看、搜索和维护当前用户的凭据记录。</p>
            </div>
            <a class="btn btn-primary" href="{% url 'password:password_manage' %}">
                <i class="fas fa-list me-1"></i>进入凭据列表
            </a>
        </div>
    </section>
</div>
{% endblock %}
