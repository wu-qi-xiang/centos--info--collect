name: Django quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade 'pip<25'
          python -m pip install -r requirements.txt
          python -m pip install -r deploy/requirements-prod.txt
      - name: Verify runtime baseline
        run: |
          python -c "import sys, django; assert sys.version_info[:2] == (3, 11), sys.version; assert django.VERSION[:3] == (4, 2, 16), django.get_version()"
      - name: Critical operations HTTP quality gate
        run: python manage.py test aiops.test_critical_operations_flow
      - name: Validate Django project
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Validate offline production configuration
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "False"
          DJANGO_SECRET_KEY: ci-production-placeholder
          DATA_ENCRYPTION_KEY: ci-data-encryption-placeholder
          DJANGO_ALLOWED_HOSTS: ci.invalid
          DB_ENGINE: postgresql
          DB_NAME: pylinux_ci
          DB_USER: pylinux_ci
          DB_PASSWORD: ci-database-placeholder
          DB_HOST: postgres
          DB_PORT: "5432"
          PRODUCTION_ENV_FILE: /tmp/pylinux-production.env
        run: |
          touch "$PRODUCTION_ENV_FILE"
          python manage.py check --deploy
          python manage.py collectstatic --noinput
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.production.yml config --quiet

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Report dependency audit when scanner is available
        run: |
          if python -m pip_audit --version; then
            python -m pip_audit -r requirements.txt
            python -m pip_audit -r deploy/requirements-prod.txt
          else
            echo "pip-audit is not installed; dependency audit skipped."
          fi

  secret-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report repository secret scan when scanner is available
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --redact
          else
            echo "gitleaks is not installed; secret scan skipped."
          fi
