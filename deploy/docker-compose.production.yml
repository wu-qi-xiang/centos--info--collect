services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ${PRODUCTION_ENV_FILE:?Set_PRODUCTION_ENV_FILE_to_an_untracked_environment_file}
        required: true
    environment:
      POSTGRES_DB: ${DB_NAME:?Set_DB_NAME_in_the_production_environment_file}
      POSTGRES_USER: ${DB_USER:?Set_DB_USER_in_the_production_environment_file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set_DB_PASSWORD_in_the_production_environment_file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    env_file: !reset
      - path: ${PRODUCTION_ENV_FILE:?Set_PRODUCTION_ENV_FILE_to_an_untracked_environment_file}
        required: true
    environment:
      DB_ENGINE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CHARSET: ""
      DJANGO_STATIC_ROOT: /app/staticfiles
    ports: !reset []
    volumes: !override
      - static_data:/app/staticfiles
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    env_file: !reset
      - path: ${PRODUCTION_ENV_FILE:?Set_PRODUCTION_ENV_FILE_to_an_untracked_environment_file}
        required: true
    environment:
      DB_ENGINE: postgresql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_CHARSET: ""
      DJANGO_STATIC_ROOT: /app/staticfiles
    volumes: !override
      - static_data:/app/staticfiles
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_data:
  uploads_data:
  logs_data:
