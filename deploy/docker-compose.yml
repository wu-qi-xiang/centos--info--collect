services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ../db.sqlite3:/app/db.sqlite3
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    command: gunicorn PyLinux.wsgi:application -c deploy/gunicorn.conf.py

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../db.sqlite3:/app/db.sqlite3
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    command: python manage.py devops_worker

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../db.sqlite3:/app/db.sqlite3
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    command: python manage.py devops_scheduler
